name: EmaC discovery paired block

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      pair_ordinal:
        required: true
        type: number
      seed_base:
        required: true
        type: number
      image_tag:
        required: true
        type: string
      artifact_label:
        required: true
        type: string
      enabled:
        required: false
        default: true
        type: boolean
      enforce_validity:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  pair:
    if: inputs.enabled
    runs-on: ubuntu-24.04
    # Keep the job-level ceiling at GitHub's maximum. The experiment step has a
    # lower ceiling so `always()` diagnostics, teardown, and artifact upload
    # still run when the experiment itself stalls.
    timeout-minutes: 360
    continue-on-error: ${{ !inputs.enforce_validity }}
    env:
      ARTIFACT_ROOT: artifacts/${{ inputs.artifact_label }}
      COMPOSE_ENV: experiment/ci-images.env
      EMAC_COMPOSE_ENV: experiment/ci-images.env
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the frozen experiment commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve commit-pinned GHCR image coordinates
        shell: bash
        run: |
          set -euo pipefail
          cp experiment/images.lock.env "$COMPOSE_ENV"
          echo "APP_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY}" >> "$COMPOSE_ENV"
          echo "APP_IMAGE_TAG=${{ inputs.image_tag }}" >> "$COMPOSE_ENV"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the single frozen image set
        run: docker compose --env-file "$COMPOSE_ENV" pull --quiet

      - name: Resolve paired-block artifact path
        shell: bash
        run: |
          pair_id=$(printf '%02d' "${{ inputs.pair_ordinal }}")
          echo "PAIR_DIR=$ARTIFACT_ROOT/run/${{ inputs.phase }}/pair-$pair_id" >> "$GITHUB_ENV"

      - name: Execute primary paired block
        timeout-minutes: 300
        shell: bash
        run: |
          set -euo pipefail
          pair_seed=$((${{ inputs.seed_base }} + ${{ inputs.pair_ordinal }}))
          python3 experiment/scripts/run_experiment.py \
            --output "$ARTIFACT_ROOT/run" \
            --phase "${{ inputs.phase }}" \
            --pair-ordinal "${{ inputs.pair_ordinal }}" \
            --seed "$pair_seed" \
            --allow-invalid \
            --defer-secondary

      - name: Evaluate evidence-source ablations
        timeout-minutes: 30
        run: >-
          python3 experiment/scripts/secondary_analysis.py ablations
          --pair-dir "$PAIR_DIR"
          --phase "${{ inputs.phase }}"
          --pair-ordinal "${{ inputs.pair_ordinal }}"

      - name: Evaluate negative binding cases
        timeout-minutes: 30
        run: >-
          python3 experiment/scripts/secondary_analysis.py negative-cases
          --pair-dir "$PAIR_DIR"
          --phase "${{ inputs.phase }}"
          --pair-ordinal "${{ inputs.pair_ordinal }}"

      - name: Evaluate telemetry robustness
        timeout-minutes: 60
        run: >-
          python3 experiment/scripts/secondary_analysis.py robustness
          --pair-dir "$PAIR_DIR"
          --phase "${{ inputs.phase }}"
          --pair-ordinal "${{ inputs.pair_ordinal }}"

      - name: Finalize paired-block validity and report
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          validity_flag=""
          if [[ "${{ inputs.enforce_validity }}" != "true" ]]; then
            validity_flag="--allow-invalid"
          fi
          python3 experiment/scripts/secondary_analysis.py finalize \
            --pair-dir "$PAIR_DIR" \
            --phase "${{ inputs.phase }}" \
            --pair-ordinal "${{ inputs.pair_ordinal }}" \
            $validity_flag

      - name: Capture complete paired-block logs
        if: always()
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p "$ARTIFACT_ROOT"
          docker compose --env-file "$COMPOSE_ENV" ps --all --no-trunc > "$ARTIFACT_ROOT/compose-ps.txt" 2>&1 || true
          docker compose --env-file "$COMPOSE_ENV" logs --no-color --timestamps > "$ARTIFACT_ROOT/compose.log" 2>&1 || true
          for journal in artifacts/fault-journal.jsonl artifacts/router-journal.jsonl; do
            if [[ -f "$journal" ]]; then
              cp "$journal" "$ARTIFACT_ROOT/"
            fi
          done

      - name: Tear down the isolated paired-block stack
        if: always()
        timeout-minutes: 20
        run: docker compose --env-file "$COMPOSE_ENV" down --volumes --remove-orphans || true

      - name: Publish paired-block evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: emac-${{ inputs.artifact_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_ROOT }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
