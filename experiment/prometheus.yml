global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway-a:8080]
        labels:
          instance: gateway-A
      - targets: [gateway-b:8080]
        labels:
          instance: gateway-B
  - job_name: customers-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [customers-service:8081]
        labels:
          instance: customers-1
  - job_name: visits-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [visits-service:8082]
        labels:
          instance: visits-1

